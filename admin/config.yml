backend:
  name: github
  repo: ourkindoflove/ourkindoflove.github.io
  branch: main

media_folder: "assets/img/posts"
public_folder: "/assets/img/posts"

locale: ko

collections:
  - name: "posts"
    label: "포스트"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "영문 슬러그", name: "slug", widget: "string", hint: "URL에 들어갈 이름. 예: Interview"}
      - {label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss +0900"}
      - {label: "카테고리", name: "categories", widget: "list", default: ["SL"]}
      - {label: "태그", name: "tags", widget: "list"}
      - {label: "한 줄 설명", name: "description", widget: "string"}
      - {label: "공개", name: "published", widget: "boolean", default: true, required: false, hint: "끄면 초안이에요. 블로그에 보이지 않아요(블로그로 보내기 플러그인은 기본으로 초안으로 올려요)."}
      - {label: "본문", name: "body", widget: "text", hint: "HTML을 적힌 그대로 저장해요(~ 같은 기호에 \\를 붙이지 않아요). 마크다운도 그대로 쓸 수 있어요."}
