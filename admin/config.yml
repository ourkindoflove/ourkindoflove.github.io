backend:
  name: github
  # 원고가 있는 비공개 레포. 공개 레포 ourkindoflove.github.io 에는 완성된 화면만 올라간다.
  repo: ourkindoflove/SL-blog
  branch: main

media_folder: "assets/img/posts"
public_folder: "/assets/img/posts"

# 그림을 올릴 때 크기를 줄여 WebP로 바꿔 저장해요(긴 변 2048px, 품질 85). 작은 그림은 키우지 않아요.
# GIF·SVG는 그대로 올라가요(움짤이 멈추지 않게 PNG·JPEG만 바꿔요). 파일 이름은 영문·숫자로 정리해요.
media_libraries:
  default:
    config:
      max_file_size: 30000000
      slugify_filename: true
      transformations:
        png:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        jpeg:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: "posts"
    label: "포스트"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    # 글 목록: 제목(날짜), 최신 글이 위로. 초안만 모아 보기·연도별로 묶어 보기.
    summary: "{{title}} ({{date | date('YYYY-MM-DD')}})"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_filters:
      filters:
        - name: drafts
          label: "초안만"
          field: published
          pattern: false
    view_groups:
      groups:
        - name: year
          label: "연도"
          field: date
          pattern: "\\d{4}"
    # 편집 화면 오른쪽 미리보기는 admin/preview.js가 본문 HTML을 블로그처럼 그려요.
    # 본문 칸은 admin/body-editor.js가 그려요(보이는 대로 고치기, HTML, 찾아 바꾸기, 그림 넣기).
    # 「블로그에서 보기」 링크는 영문 슬러그가 있는 글에서 써요.
    preview_path: "/posts/{{fields.slug}}/"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "영문 슬러그", name: "slug", widget: "string", hint: "URL에 들어갈 이름. 예: Interview"}
      - {label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss +0900"}
      - {label: "카테고리", name: "categories", widget: "list", default: ["SL"]}
      - {label: "태그", name: "tags", widget: "list"}
      - {label: "한 줄 설명", name: "description", widget: "string"}
      - {label: "공개", name: "published", widget: "boolean", default: true, required: false, hint: "끄면 초안이에요. 블로그에 보이지 않아요(블로그로 보내기 플러그인은 기본으로 초안으로 올려요)."}
      - {label: "맨 위 고정", name: "pin", widget: "boolean", required: false, hint: "켜면 블로그 첫 화면 맨 위에 고정돼요."}
      - {label: "대표 그림", name: "image", widget: "image", required: false, hint: "글 목록의 미리보기 그림이에요. 글 맨 위에도 크게 보여요. 비워 두면 없어요."}
      - label: "삽화"
        label_singular: "삽화"
        name: "illust"
        widget: "list"
        required: false
        thumbnail: "image"
        hint: "여기 올린 순서대로 본문에 [삽화1], [삽화2]…라고 쓰면 그 자리에 그림이 들어가요. 순서를 바꾸면 번호도 바뀌어요."
        fields:
          - {label: "그림", name: "image", widget: "image"}
          - {label: "그림 설명", name: "alt", widget: "string", required: false, hint: "그림을 못 볼 때 읽히는 글이에요. 화면 읽기 프로그램도 읽어요."}
          - {label: "폭(%)", name: "width", widget: "number", value_type: "int", min: 10, max: 100, required: false, hint: "비우면 원래 크기(본문 폭까지)."}
      - {label: "본문", name: "body", widget: "bloghtml", hint: "「보이는 대로」에서 글자를 눌러 고치고, 「HTML」에서 원문을 고쳐요. 고친 곳 말고는 원문을 한 글자도 바꾸지 않아요. 그림은 넣을 자리를 누른 뒤 「그림 넣기」, 또는 위 「삽화」에 올리고 [삽화1]처럼 써요."}

  # 첫 화면의 작품 서가와 작품 페이지(_data/works.yml). 작품마다 책 한 권이에요.
  # 이 파일은 맨 위가 목록이라 root: true 로 고쳐요. 편집 화면에서 저장하면 파일 안의 주석은 사라지니,
  # 설명은 여기 hint 에 적어 둬요.
  - name: "shelf"
    label: "작품 서가"
    files:
      - name: "works"
        label: "작품 서가"
        file: "_data/works.yml"
        fields:
          - label: "작품"
            label_singular: "작품"
            name: "works"
            widget: "list"
            root: true
            summary: "{{title}} ({{key}})"
            hint: "첫 화면 서가에 놓이는 책이에요. 위에 있는 작품이 왼쪽에 놓여요. 그 카테고리의 글이 하나도 없으면 서가에 나오지 않아요."
            fields:
              - {label: "카테고리 이름", name: "key", widget: "string", hint: "이 작품의 글에 적는 카테고리와 글자 하나까지 똑같이 적어요. 예: SL"}
              - {label: "표지 제목", name: "title", widget: "string"}
              - {label: "표지 윗줄", name: "kicker", widget: "string", required: false, hint: "제목 위의 작은 글이에요. 예: 세연과 나"}
              - {label: "소개", name: "intro", widget: "text", required: false, hint: "한두 줄이 보기 좋아요. 작품 속 한마디를 그대로 적어도 돼요."}
              - {label: "말한 사람", name: "by", widget: "string", required: false, hint: "소개가 작품 속 한마디일 때, 누가 어디서 한 말인지 적으면 작은 줄로 붙어요. 예: 세연, 속초에서. 비워 두면 안 나와요."}
              - label: "표지 색"
                name: "tone"
                widget: "select"
                default: "love"
                options:
                  - {label: "분홍과 파랑 (밤에는 남색과 분홍)", value: "love"}
                  - {label: "짙은 자주", value: "ruins"}
                  - {label: "연보라", value: "wing"}
                hint: "새 색이 필요하면 Claude에게 말해 주세요. 색을 정하는 몇 줄을 더해야 해요."
